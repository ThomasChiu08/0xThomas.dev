        <text class="mono muted" font-size="12" x="302" y="46">AI / SYSTEM</text>
        <text class="sans text" font-size="31" font-weight="760" x="28" y="98">agentOS</text>
        <text class="sans soft" font-size="18" x="28" y="146">A multi-agent operating system</text>
        <text class="sans soft" font-size="18" x="28" y="174">framework for reliable AI</text>
        <text class="sans soft" font-size="18" x="28" y="202">workflows.</text>
        <g transform="translate(104 230)" stroke="#0d0f0d" stroke-opacity=".66">
          <circle cx="95" cy="60" r="12" fill="#0d0f0d"/>
          <g>
            <path d="M95 60 143 60" stroke-dasharray="2 5"/>
            <path d="M95 60 125 92" stroke-dasharray="2 5"/>
            <path d="M95 60 72 96" stroke-dasharray="2 5"/>
            <path d="M95 60 52 77" stroke-dasharray="2 5"/>
            <path d="M95 60 58 40" stroke-dasharray="2 5"/>
            <path d="M95 60 88 20" stroke-dasharray="2 5"/>
            <path d="M95 60 126 28" stroke-dasharray="2 5"/>
            <circle cx="143" cy="60" r="5"/>
            <circle cx="125" cy="92" r="5"/>
            <circle cx="72" cy="96" r="5" fill="#0d0f0d"/>
            <circle cx="52" cy="77" r="5"/>
            <circle cx="58" cy="40" r="5"/>
            <circle cx="88" cy="20" r="5"/>
            <circle cx="126" cy="28" r="5"/>
          </g>
        </g>
        <text class="mono muted" font-size="12" x="28" y="398">BUILDING</text>
        <text class="mono muted" font-size="11" x="28" y="428">TS  NEXT.JS  PYTHON  REDIS</text>
      </g>

      <g transform="translate(940 0)">
        <rect width="410" height="454" fill="#fffef8" fill-opacity=".62" stroke="#1f231f" stroke-opacity=".48"/>
        <rect width="410" height="6" fill="#caff00"/>
        <text class="mono muted" font-size="13" x="28" y="46">03</text>
        <text class="mono muted" font-size="12" x="258" y="46">FINANCE / TRADING</text>
        <text class="sans text" font-size="31" font-weight="760" x="28" y="98">AlphaLoop</text>
        <text class="sans soft" font-size="18" x="28" y="146">A trading decision and review</text>
        <text class="sans soft" font-size="18" x="28" y="174">system for structured feedback</text>
        <text class="sans soft" font-size="18" x="28" y="202">loops.</text>
        <g transform="translate(102 236)" stroke="#0d0f0d" stroke-opacity=".66">
          <path d="M17 82c38-42 106-54 153-16" stroke-dasharray="2 5"/>
          <path d="M30 26v62"/>
          <rect x="25" y="48" width="10" height="28"/>
          <path d="M66 33v62"/>
          <rect x="61" y="44" width="10" height="28"/>
          <path d="M104 40v62"/>
          <rect x="99" y="40" width="10" height="28"/>
          <path d="M139 47v62"/>
          <rect x="134" y="36" width="10" height="28" fill="#0d0f0d"/>
          <path d="M166 54v62"/>
