    <g transform="translate(40 622)">
      <rect width="36" height="4" fill="#0d0f0d"/>
      <rect x="48" width="36" height="4" fill="#0d0f0d" opacity=".32"/>
      <text class="mono muted" font-size="11" x="102" y="6">PAGE 1 / 2. NEXT SHOWS XTopicMonitor, FocusBox, and wraps one anchor card.</text>
    </g>
  </g>

  <g transform="translate(96 922)">
    <text class="mono muted" font-size="12">MOTION: on next, cards slide left, fade/scale subtly, and a new card enters from the right. Flip can animate re-ordering if a selected card moves into the center.</text>
  </g>
</svg>
