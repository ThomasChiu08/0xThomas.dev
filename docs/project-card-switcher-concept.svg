<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" fill="none">
  <rect width="1600" height="980" fill="#f2f1eb"/>
  <defs>
    <pattern id="paper" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#0d0f0d" opacity=".05"/>
    </pattern>
    <style>
      .mono{font-family:Menlo,Consolas,monospace;letter-spacing:0;text-transform:uppercase}
      .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
      .serif{font-family:Georgia,'Times New Roman',serif}
      .text{fill:#0d0f0d}
      .soft{fill:#2a2f2a}
      .muted{fill:#6c716a}
      .line{stroke:#1f231f;stroke-opacity:.55}
    </style>
  </defs>
  <rect width="1600" height="980" fill="url(#paper)" opacity=".72"/>

  <g transform="translate(96 72)">
    <text class="mono text" font-size="13">/ PROJECTS</text>
    <text class="sans muted" font-size="22" y="72">Early systems and product experiments designed to become useful,</text>
    <text class="sans muted" font-size="22" y="104">observable, and compounding over time.</text>
    <text class="mono text" font-size="13" x="1238" y="96">DISCUSS PROJECTS  -&gt;</text>
  </g>

  <g transform="translate(96 216)">
    <rect width="1408" height="664" stroke="#1f231f" stroke-opacity=".55"/>
    <line x1="0" x2="1408" y1="94" y2="94" class="line"/>

    <g transform="translate(28 28)">
      <text class="mono muted" font-size="12">CARD SET</text>
      <text class="sans text" font-size="24" font-weight="720" x="92" y="5">3 visible / 5 total</text>
    </g>

    <g transform="translate(1132 22)">
      <rect x="0" y="0" width="46" height="46" stroke="#1f231f" stroke-opacity=".65"/>
      <text class="sans text" font-size="24" x="16" y="31">&lt;</text>
      <rect x="58" y="0" width="46" height="46" fill="#0d0f0d"/>
      <text fill="#fbfaf5" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" x="74" y="31">&gt;</text>
      <text class="mono muted" font-size="11" x="124" y="29">NEXT SET</text>
    </g>

    <g transform="translate(40 132)">
      <g>
        <rect width="410" height="454" fill="#fffef8" fill-opacity=".62" stroke="#1f231f" stroke-opacity=".48"/>
        <rect width="410" height="6" fill="#caff00"/>
