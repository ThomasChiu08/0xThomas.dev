        <text class="mono muted" font-size="12" x="292" y="46">MACOS / HEALTH</text>
        <text class="sans text" font-size="31" font-weight="760" x="28" y="98">NotchMove</text>
        <text class="sans soft" font-size="18" x="28" y="146">A native macOS menu bar utility</text>
        <text class="sans soft" font-size="18" x="28" y="174">for low-interruption movement</text>
        <text class="sans soft" font-size="18" x="28" y="202">reminders.</text>
        <g transform="translate(92 234)" stroke="#0d0f0d" stroke-opacity=".65">
          <path d="M52 28c0-9 7-16 16-16h54c9 0 16 7 16 16v9c0 7 5 12 12 12h7c8 0 14 6 14 14v26c0 8-6 14-14 14H33c-8 0-14-6-14-14V63c0-8 6-14 14-14h7c7 0 12-5 12-12z"/>
          <path d="M64 37h62" stroke-width="1.4"/>
          <path d="M42 72h106" stroke-dasharray="2 5"/>
          <circle cx="56" cy="72" r="4" fill="#0d0f0d"/>
          <circle cx="95" cy="72" r="4"/>
          <circle cx="134" cy="72" r="4"/>
          <path d="M68 92h54"/>
